name: CD Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deployment & Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deployment Configuration
        run: |
          echo "Starting production deployment pipeline..."
          echo "Release commit: ${{ github.sha }}"

      # If using SSH deployment to Oracle Cloud / VPS:
      - name: Deploy to Production Host
        if: env.DEPLOY_SSH_HOST != ''
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "bash -s" < scripts/deploy-production.sh

      - name: Post-Deployment Health Check
        run: |
          echo "Deployment successfully dispatched. Monitored by health-watchdog."
